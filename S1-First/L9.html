    <!-- تضمين Tailwind CSS -->

    <style>
        /* إضافة خط Inter لدعم اللغة العربية بشكل جميل وتناسق عالمي */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ee 100%); /* خلفية متدرجة مشابهة لخلفية موقعك */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        /* حاوية الفيديو (Responsive Aspect Ratio 16:9) */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* نسبة 16:9 */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            background-color: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* تنسيق الأزرار المشابهة لتصميم الموقع */
        .btn-primary {
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5);
        }
    </style>
</head>
